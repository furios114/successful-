<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог — Successful Club</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><img src="logo.png" alt="Successful Club"></a>
    <button class="burger" id="burger">☰</button>
    <nav class="nav" id="nav">
      <a href="index.html">Главная</a>
      <a href="catalog.html" class="active">Каталог</a>
      <a href="favorites.html">Избранное <span class="badge" data-fav-count>0</span></a>
      <a href="cart.html">Корзина <span class="badge" data-cart-count>0</span></a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="catalog-head"><h1>КАТАЛОГ</h1></div>
  <div class="filters">
    <div class="search-box">
      <input id="search" type="search" placeholder="Поиск товаров...">
    </div>
    <div class="cats">
      <button class="cat-btn active" data-cat="all">Все</button>
      <button class="cat-btn" data-cat="hoodies">Худи</button>
      <button class="cat-btn" data-cat="tshirts">Футболки</button>
      <button class="cat-btn" data-cat="pants">Штаны</button>
      <button class="cat-btn" data-cat="accessories">Аксессуары</button>
    </div>
    <select id="sort">
      <option value="default">По умолчанию</option>
      <option value="asc">Цена ↑</option>
      <option value="desc">Цена ↓</option>
      <option value="name">По названию</option>
    </select>
  </div>
  <div class="result-info">Найдено: <span id="result-count">0</span></div>
  <div class="grid" id="catalog-grid"></div>
</div>

<footer class="footer">
  <div class="container footer-inner">
    <div>© 2025 Successful Club</div>
    <div>Заказы: <a href="https://t.me/Dr1lly52" target="_blank">@Dr1lly52</a></div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("burger").onclick = () =>
    document.getElementById("nav").classList.toggle("open");
</script>
</body>
</html>
